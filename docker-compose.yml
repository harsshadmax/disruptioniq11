services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: disruptioniq
      POSTGRES_PASSWORD: disruptioniq
      POSTGRES_DB: disruptioniq
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U disruptioniq"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
